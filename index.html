<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Mini Feed Simulator</title>
</head>

<body>

    <!-- Header -->
    <div class="container d-flex justify-content-center mt-2" id="header-container">
        <h1 class="header-title text-primary opacity-75 my-3">Feed</h1>
    </div>

    <!-- Filters -->
    <div class="container d-flex justify-content-start" id="filters-container">
        <div class="btn-toolbar my-3" role="toolbar" aria-label="Toolbar with button groups">
            <div class="btn-group me-2" id="filters-radio" role="group" aria-label="Basic radio toggle button group">
                
                <input type="radio" class="btn-check" name="btnradio" id="newest-sort" autocomplete="off" checked>
                <label class="btn btn-outline-primary" for="newest-sort">Newest</label>
                
                <input type="radio" class="btn-check" name="btnradio" id="oldest-sort" autocomplete="off">
                <label class="btn btn-outline-primary" for="oldest-sort">Oldest</label>

                <input type="radio" class="btn-check" name="btnradio" id="liked-sort" autocomplete="off">
                <label class="btn btn-outline-primary" for="liked-sort">Likes</label>
                
            </div>
            <div class="input-group" id="search-bar">
                <div class="input-group-text" id="btnGroupAddon">@</div>
                <input type="text" class="form-control" id="user-search" placeholder="Find user"
                    aria-label="Input group example" aria-describedby="btnGroupAddon">
            </div>
        </div>
    </div>

    <!-- Posts area -->
    <div class="container text-center mt-5" id="posts-container">
        <div class="row d-flex flex-row flex-nowrap overflow-x-auto gap-2" id="posts-area">
            <p class="my-5 text-primary text-opacity-75 no-posts-msg">No posts yet, everybody is shy. <br> Say hello to the world!</p>
            <div class="col d-flex flex-row justify-content-center">
                <div class="card w-50">
                    <div class="card-body">
                        <h5 class="card-title">User</h5>
                        <p class="card-text">Explore the app to see your crew's posts...</p>
                        <a href="#" class="btn btn-primary like-button">Like</a>
                    </div>
                    <div class="card-footer text-body-secondary d-flex justify-content-center">
                        <span class="my-auto like-count">1M likes</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Area -->
    <div class="container text-center mt-5" id="form-container">
        <div class="row">
            <div class="col d-flex justify-content-center">
                <form class="needs-validation w-75" novalidate>
                    <div class="form-floating mb-3 mt-3">
                        <input type="text" class="form-control" id="username-input" name="username-input"
                            placeholder="@David" required>
                        <label for="username-input">Username</label>
                        <div class="invalid-feedback">Don't leave this empty.</div>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="content-input" name="content-input" value=""
                            placeholder="Happy" required>
                        <label for="content-input">Say something to your friends</label>
                        <div class="invalid-feedback">Don't leave this empty.</div>
                    </div>
                    <button type="submit" class="btn btn-outline-primary mb-3 py-2 w-100" id="send-post-btn">Post</button>
                </form>
            </div>
        </div>
    </div>

    <script src="functions.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
